<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0f0f1a"/>
  <!-- TV body -->
  <rect x="64" y="120" width="384" height="230" rx="24" fill="#1a1a2e" stroke="#6366f1" stroke-width="8"/>
  <!-- TV screen -->
  <rect x="88" y="144" width="336" height="182" rx="10" fill="#0d0d1f"/>
  <!-- Screen glow gradient -->
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0d1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="88" y="144" width="336" height="182" rx="10" fill="url(#screenGlow)"/>
  <!-- Mic icon on screen -->
  <g transform="translate(256,225)" stroke="#ec4899" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-28" y="-52" width="56" height="70" rx="28" fill="none"/>
    <path d="M-44 10v8a44 44 0 0 0 88 0v-8"/>
    <line x1="0" y1="62" x2="0" y2="78"/>
    <line x1="-24" y1="78" x2="24" y2="78"/>
  </g>
  <!-- Pulse dots -->
  <circle cx="192" cy="225" r="8" fill="#6366f1" opacity="0.6"/>
  <circle cx="320" cy="225" r="8" fill="#6366f1" opacity="0.6"/>
  <!-- TV stand -->
  <rect x="220" y="350" width="72" height="24" rx="6" fill="#1a1a2e"/>
  <rect x="176" y="374" width="160" height="18" rx="9" fill="#1a1a2e"/>
  <!-- IA text -->
  <text x="256" y="450" font-family="-apple-system,system-ui,sans-serif" font-size="52" font-weight="800"
        fill="#6366f1" text-anchor="middle" letter-spacing="4">IA</text>
</svg>
